server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

# Resolved through Eureka via the @LoadBalanced RestTemplate;
# override with a direct URL for non-Eureka environments.
app:
  user-service:
    url: ${USER_SERVICE_URL:http://user-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
